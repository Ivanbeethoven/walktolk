plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'dev.dsh.otg'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.dsh.otg'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/Java-WebSocket-1.6.0.jar', 'libs/slf4j-api-2.0.13.jar')
}
